services:
  jaeger:
    image: "jaegertracing/all-in-one:latest"
    ports:
      - "16686:16686"
      - "4318:4318"
      
  consul:
    image: hashicorp/consul
    command: agent -dev -client=0.0.0.0
    ports:
      - 8500:8500
      - 8600:8600/udp
      
  kafka:
    image: "apache/kafka:latest"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    restart: always

  kafka-ui:
    image: "provectuslabs/kafka-ui:latest"
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-stratum-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    restart: always
      
  gateway-postgres:
    image: "postgres:15-alpine"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEV_GATEWAY_POSTGRES_PASSWORD}
      POSTGRES_DB: gateway
    ports:
      - "5435:5432"

  orders-postgres:
    image: "postgres:15-alpine"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEV_ORDERS_POSTGRES_PASSWORD}
      POSTGRES_DB: orders
    ports:
      - "5433:5432"

  payments-postgres:
    image: "postgres:15-alpine"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEV_PAYMENTS_POSTGRES_PASSWORD}
      POSTGRES_DB: payments
    ports:
      - "5434:5432"

  stock-postgres:
    image: "postgres:15-alpine"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEV_STOCK_POSTGRES_PASSWORD:-password}
      POSTGRES_DB: stock
    ports:
      - "5436:5432"

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      - ADVERTISED_ADDR=gateway:8080
      - CONSUL_ADDR=consul:8500
      - JAEGER_ADDR=jaeger:4318
      - GATEWAY_HTTP_ADDRESS=http://localhost:8080
      - DB_URI=postgres://postgres:${DEV_GATEWAY_POSTGRES_PASSWORD}@gateway-postgres:5432/gateway?sslmode=disable
      - KAFKA_BROKERS=kafka:29092
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      - consul
      - jaeger
      - gateway-postgres
      - kafka

  orders:
    build:
      context: .
      args:
        SERVICE: orders
    environment:
      - ADVERTISED_ADDR=orders:2000
      - GRPC_ADDR=:2000
      - CONSUL_ADDR=consul:8500
      - JAEGER_ADDR=jaeger:4318
      - KAFKA_BROKERS=kafka:29092
      - DB_URI=postgres://postgres:${DEV_ORDERS_POSTGRES_PASSWORD}@orders-postgres:5432/orders?sslmode=disable
    restart: always
    depends_on:
      - consul
      - kafka
      - orders-postgres

  payments:
    build:
      context: .
      args:
        SERVICE: payments
    environment:
      - ADVERTISED_ADDR=payments:2001
      - GRPC_ADDRESS=:2001
      - CONSUL_ADDR=consul:8500
      - JAEGER_ADDR=jaeger:4318
      - KAFKA_BROKERS=kafka:29092
      - DB_URI=postgres://postgres:${DEV_PAYMENTS_POSTGRES_PASSWORD}@payments-postgres:5432/payments?sslmode=disable
      - GATEWAY_HTTP_ADDRESS=http://localhost:5173
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - RAZORPAY_ITEM_PRICES={"1":19900,"2":9900,"3":9900,"default":9900}
    restart: always
    depends_on:
      - consul
      - kafka
      - payments-postgres

  stock:
    build:
      context: .
      args:
        SERVICE: stock
    environment:
      - ADVERTISED_ADDR=stock:2002
      - GRPC_ADDR=:2002
      - CONSUL_ADDR=consul:8500
      - JAEGER_ADDR=jaeger:4318
      - KAFKA_BROKERS=kafka:29092
      - DB_URI=postgres://postgres:${DEV_STOCK_POSTGRES_PASSWORD:-password}@stock-postgres:5432/stock?sslmode=disable
    restart: always
    depends_on:
      - consul
      - kafka
      - stock-postgres

  kitchen:
    build:
      context: .
      args:
        SERVICE: kitchen
    environment:
      - ADVERTISED_ADDR=kitchen:2003
      - GRPC_ADDR=:2003
      - CONSUL_ADDR=consul:8500
      - JAEGER_ADDR=jaeger:4318
      - KAFKA_BROKERS=kafka:29092
    restart: always
    depends_on:
      - consul
      - kafka


  cart:
    build:
      context: .
      args:
        SERVICE: cart
    environment:
      - ADVERTISED_ADDR=cart:2005
      - GRPC_ADDR=:2005
      - CONSUL_ADDR=consul:8500
      - JAEGER_ADDR=jaeger:4318
      - REDIS_ADDR=redis:6379
    restart: always
    depends_on:
      - consul
      - redis

  notification:
    build:
      context: .
      args:
        SERVICE: notification
    environment:
      - ADVERTISED_ADDR=notification:2006
      - CONSUL_ADDR=consul:8500
      - JAEGER_ADDR=jaeger:4318
      - KAFKA_BROKERS=kafka:29092
    restart: always
    depends_on:
      - consul
      - kafka

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    restart: always
    depends_on:
      - gateway
